<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>คำเติบ — สั่งอาหาร</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#18181b;--mute:#71717a;--line:#e4e4e7;--acc:#d92638;--acc-soft:#fff1f2;--ai:#fff;--chip:#f4f4f5;--shadow:0 2px 10px rgba(0,0,0,.05)}
:root[data-theme="dark"]{--bg:#121214;--card:#1c1c20;--ink:#f4f4f5;--mute:#a1a1aa;--line:#2e2e34;--acc:#f43f5e;--acc-soft:#2d151b;--ai:#fff;--chip:#27272a;--shadow:0 2px 12px rgba(0,0,0,.35)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121214;--card:#1c1c20;--ink:#f4f4f5;--mute:#a1a1aa;--line:#2e2e34;--acc:#f43f5e;--acc-soft:#2d151b;--ai:#fff;--chip:#27272a;--shadow:0 2px 12px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'Noto Sans Thai',system-ui,sans-serif;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;transition:.15s}
button:active{transform:scale(.97)}
input,select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--acc)}
.hdr{position:sticky;top:0;z-index:15;background:var(--card);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px}
.hdr-in{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:8px}.brand h1{font-size:18px;margin:0}
.tag{font-size:11px;font-weight:600;background:var(--acc-soft);color:var(--acc);padding:3px 8px;border-radius:99px}
.icon-btn{width:36px;height:36px;padding:0;display:grid;place-items:center;border-radius:99px;font-size:16px}
main{max-width:640px;margin:0 auto;padding:12px 14px}
.promo-bar{background:var(--acc-soft);color:var(--acc);border:1px solid rgba(217,38,56,.2);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.search-box{position:relative;margin-bottom:10px}.search-box input{padding-left:36px;border-radius:99px}.search-box span{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--mute);font-size:14px;pointer-events:none}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
.cats button{border-radius:99px;padding:7px 14px;font-size:13px;font-weight:600;white-space:nowrap}.cats button.on{background:var(--acc);color:var(--ai);border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:540px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;cursor:pointer;position:relative}
.card.sold{opacity:.55}.thumb{aspect-ratio:1/1;background:var(--chip);position:relative;overflow:hidden;display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}.thumb .ph{font-size:44px}
.badge{position:absolute;top:8px;left:8px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:rgba(24,24,27,.82);color:#fff}
.badge.hot{background:var(--acc)}.badge.new{background:#059669}.badge.sold{left:auto;right:8px;background:#52525b}
.cbody{padding:10px;display:flex;flex-direction:column;flex:1;justify-content:space-between;gap:6px}
.cname{font-weight:600;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cfoot{display:flex;align-items:center;justify-content:space-between;margin-top:2px}.price{font-weight:700;font-size:15px;color:var(--acc)}
.add-mini{width:30px;height:30px;padding:0;border-radius:99px;background:var(--acc);color:var(--ai);border:0;font-size:18px;font-weight:700;display:grid;place-items:center}
.bar-wrap{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:0 14px;z-index:18;pointer-events:none}
.bar{max-width:612px;margin:0 auto;pointer-events:auto;background:var(--acc);color:var(--ai);border-radius:14px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 8px 24px rgba(217,38,56,.35);cursor:pointer;font-weight:700}
.bar-cnt{background:rgba(255,255,255,.22);padding:2px 9px;border-radius:99px;font-size:13px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.q{display:flex;align-items:center;gap:8px}.q button{width:28px;height:28px;padding:0;border-radius:8px;font-weight:700}
.tot{display:flex;justify-content:space-between;padding:4px 0;color:var(--mute);font-size:14px}
.tot.big{color:var(--ink);font-size:19px;font-weight:700;padding-top:8px;border-top:1px dashed var(--line);margin-top:4px}
.mute{color:var(--mute);font-size:13px}
.upsell{display:flex;gap:8px;overflow-x:auto;padding-top:6px}.upsell button{white-space:nowrap;font-size:13px;background:var(--chip);border-radius:99px;padding:6px 12px}
button.pri{width:100%;padding:13px;background:var(--acc);color:var(--ai);border:0;border-radius:12px;font-weight:700;font-size:15px}
.msg{white-space:pre-wrap;font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;word-break:break-word}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:30}@media(min-width:540px){.modal{align-items:center;padding:16px}}
.sheet{background:var(--card);width:100%;max-width:440px;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}@media(min-width:540px){.sheet{border-radius:18px}}
.opt-group{margin:12px 0}.opt-title{font-weight:700;font-size:14px;margin-bottom:6px;display:flex;justify-content:space-between}
.pills{display:flex;flex-wrap:wrap;gap:6px}.pills button{font-size:13px;padding:6px 12px;border-radius:99px;background:var(--chip)}.pills button.on{background:var(--acc-soft);color:var(--acc);border-color:var(--acc);font-weight:700}
</style>
</head>
<body>
<header class="hdr"><div class="hdr-in"><div class="brand"><h1>🍜 คำเติบ</h1><span class="tag">🛵 เดลิเวอรี</span></div><button class="icon-btn" onclick="toggleTheme()">🌙</button></div></header>
<main id="app"></main><div id="modal"></div>

function toggleTheme(){const r=document.documentElement;r.setAttribute('data-theme',r.getAttribute('data-theme')==='dark'?'light':'dark')}
function toast(m){const t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;bottom:calc(80px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;z-index:40;font-size:13px;font-weight:600';document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function modal(h){$('#modal').innerHTML=h?`<div class="modal" onclick="if(event.target===this)modal('')">${h}</div>`:''}
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=c&0x8000?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
function tlv(s){const r=[];for(let i=0;i<s.length;){r.push([s.substr(i,2),s.substr(i+4,+s.substr(i+2,2))]);i+=4+(+s.substr(i+2,2))}return r}
function payQR(a){let r=tlv(CFG.qr).filter(x=>x[0]!=='63'&&x[0]!=='54').map(x=>x[0]==='01'?['01','12']:x);const k=r.findIndex(x=>x[0]==='53');r.splice(k+1,0,['54',(+a).toFixed(2)]);const p=r.map(x=>x[0]+String(x[1].length).padStart(2,'0')+x[1]).join('')+'6304';return p+crc16(p)}

function addrIn(e){const v=e.value,c=st.cu;c.a=v;saveCu();const d=detect(v);if(d&&d!==c.z){c.z=d;c.az=1;saveCu()}else if(!d&&c.az){c.z='';c.az=0;saveCu()}else return;vPay();const x=$('#adr');x.focus();x.setSelectionRange(v.length,v.length)}
function render(){({menu:vMenu,pay:vPay,done:vDone})[st.step]();window.scrollTo(0,0)}

function submit(){const c=st;if(!c.cart.length)return;if(!(c.cu.z&&c.cu.n.trim()&&c.cu.p.trim()&&c.cu.a.trim()))return toast('เลือกพื้นที่ และกรอกชื่อ เบอร์ ที่อยู่ให้ครบ');saveCu();const o={tk:Math.random().toString(36).slice(2,10),type:'del',table:'',items:c.cart.map(({k,...r})=>r),fee:fee(),zone:c.cu.z,cust:c.cu.n.trim(),phone:c.cu.p.trim(),addr:c.cu.a.trim()};o.total=sum(o.items)+o.fee;o.text=msg(o);if(CFG.hook)fetch(CFG.hook,{method:'POST',mode:'no-cors',body:JSON.stringify(o)}).catch(()=>{});st.done=o;st.cart=[];st.step='done';render()}

function vDone(){const o=st.done,line=CFG.chat?`<a href="https://line.me/R/oaMessage/${encodeURIComponent(CFG.chat)}/?${encodeURIComponent(o.text)}" target="_blank" rel="noopener"><button class="pri" style="margin-top:8px">ส่งทาง LINE ร้าน</button></a>`:'';$('#app').innerHTML=`<div class="panel"><h2 style="margin:0 0 6px">✅ เกือบเสร็จแล้ว</h2><p class="mute" style="margin-top:0"><b>ขั้นตอนสุดท้าย:</b> ส่งข้อความออเดอร์นี้พร้อมสลิปให้ร้านทางแชท ร้านจะตรวจสอบยอดแล้วเริ่มทำอาหารทันที</p><div class="msg">${esc(o.text)}</div>${line}<button style="width:100%;margin-top:8px" onclick="copyMsg()">คัดลอกข้อความ</button></div><button style="width:100%" onclick="st.step='menu';st.done=null;render()">สั่งอาหารใหม่</button>`}
